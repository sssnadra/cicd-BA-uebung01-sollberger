# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
    paths: [ 'pom.xml', 'src/**', '.github/workflows/build-system.yml' ]
      #Pipeline startet nur bei diesen Änderungen - bei anderen nicht.

  pull_request:
    branches: [ "main" ]
    paths: [ 'pom.xml', 'src/**', '.github/workflows/build-system.yml' ]
      #Pipeline startet nur bei diesen Änderungen - bei anderen nicht.
    
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
  #Verhindert doppelte Läufe

jobs:
  build:

    runs-on: ${{ matrix.os }}
    #runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Upload Surefire Test Reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
          name: surefire-${{ matrix.os }}-java${{ matrix.java }}
          path: target/surefire-reports
  
    strategy:
      fail-fast: true  
      matrix:
        os: [ubuntu-latest, windows-latest] 
        java: [17,21]
        exclude:
          - os: windows-latest
            java: 21     

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    #- name: Update dependency graph
    #  uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
