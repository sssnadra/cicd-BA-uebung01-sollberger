# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
    paths: [ 'Dockerfile', '.dockerignore','pom.xml', 'src/**', '.github/workflows/build-system.yml' ]
      #Pipeline startet nur bei diesen Änderungen - bei anderen nicht.


  pull_request:
    branches: [ "main" ]
    paths: [ 'Dockerfile', '.dockerignore','pom.xml', 'src/**', '.github/workflows/build-system.yml' ]
      #Pipeline startet nur bei diesen Änderungen - bei anderen nicht.
  
 
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
  #Verhindert doppelte Läufe

permissions:
  contents: read  

jobs:
  build:

    runs-on: ${{ matrix.os }}
    #runs-on: ubuntu-latest

    #depends to matrix builds
    strategy:
      fail-fast: true  
      matrix:
        os: [ubuntu-latest, windows-latest] 
        java: [17,21]
        exclude:
          - os: windows-latest
            java: 21    

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Upload Surefire Test Reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
          name: surefire-${{ matrix.os }}-java${{ matrix.java }}
          path: target/surefire-reports
    
    
    #SonarCoudQube & Jacoco      
    - name: Upload JaCoCo HTML 
      if: always()
      uses: actions/upload-artifact@v7
      with:
          name: jacoco-${{ matrix.os }}-java${{ matrix.java }}
          path: target/site/jacoco

    - name: SonarQube Cloud Scan (Maven scanner)
      if: matrix.os == 'ubuntu-latest' && matrix.java == 17 
      #for code coverage just once (not three times)
      env:
        SONAR_TOKEN: ${{ secrets.CICD_Ex2_Token }}
      run: >
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=sssnadra_cicd-BA-uebung01-sollberger
          -Dsonar.organization=sssnadra
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
    
  
  # NEUER JOB f Docker: Docker Build & Tar-Artefakt Export
  docker-build-artifact:
    runs-on: ubuntu-latest
    needs: [ build ] # erst starten, wenn die Maven-Tests & SonarCloud OK sind
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compute short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (single-arch & load into engine)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: local/app:${{ steps.vars.outputs.short_sha }}

      - name: Save image as artifact tar
        run: docker save -o image-${{ steps.vars.outputs.short_sha }}.tar local/app:${{ steps.vars.outputs.short_sha }}

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ steps.vars.outputs.short_sha }}
          path: image-${{ steps.vars.outputs.short_sha }}.tar
          retention-days: 7      
   
  

   